[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "da_py"
version = "0.8.0"
description = "Data assimilation tools for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kota Takeda" }]
dependencies = ["numpy>=1.19", "scipy>=1.1"]

[project.optional-dependencies]
etpf = ["POT>=0.9.1"]
examples = [
    "ipykernel",
    "jupyter",
    "matplotlib",
    "pandas",
    "plotly",
    "seaborn",
    "tqdm",
]
dev = [
    "ipykernel",
    "jupyter",
    "jupyter_contrib_nbextensions",
    "matplotlib",
    "pandas",
    "plotly",
    "pytest",
    "ruff==0.17.2",
    "seaborn",
    "tqdm",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"da.viz._research_figures" = ["styles/*.mplstyle"]

[tool.black]
line-length = 88

[tool.ruff]
required-version = "==0.17.2"
target-version = "py310"
# Use this pinned release's default rules; version updates are reviewed with
# their rule-set changes. Include supported code/tutorials, not archived work.
include = ["*.py", "*.pyi", "*.ipynb", "**/pyproject.toml"]
extend-exclude = ["examples/archive"]

[tool.ruff.lint.per-file-ignores]
# Keep the vendored initializer verbatim, including upstream import/export
# grouping; see its _VENDORED.md. Other checks still apply to this file.
"src/da/viz/_research_figures/__init__.py" = ["I001", "RUF022"]
