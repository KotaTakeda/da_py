name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install optional ETPF dependency on Python 3.12
        if: matrix.python-version == '3.12'
        run: python -m pip install -e '.[etpf]'
      - name: Run tests
        run: python -m pytest -ra --tb=short

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Ruff from project metadata
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          with open('pyproject.toml', 'rb') as source:
              config = tomllib.load(source)
          requirement = next(item for item in config['project']['optional-dependencies']['dev'] if item.startswith('ruff=='))
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', requirement])
          PY
      - name: Check source, tests, scripts and notebook cells
        run: ruff check . --output-format=github
